generated: '2026-09-17'
method: derived
source: openapi + /.well-known/x402.json + /.well-known/agent-card.json
auth_style: none / x402 payment gating (HTTP 402, USDC on Base); no API keys
cart:
  style: stateless
  mechanisms:
  - X-Cart-Id header
  - cart_id body field
  - ?cart_id= query
  note: Cart id passed explicitly instead of cookies, so a stateless agent can carry it across calls.
pagination:
  style: offset
  params:
  - limit
  - offset
  applies_to:
  - list-products
  response_fields: null
  note: Also a free-text q filter on product listing.
idempotency:
  coverage: none
  scope: []
  header: null
  note: The storefront OpenAPI documents no Idempotency-Key header on any write. The x402 layer offers
    a payment-identifier retry-safety extension in the ForgeMesh fleet, but this storefront contract does
    not declare it, so replay protection on cart/checkout/order writes is undocumented.
versioning:
  scheme: single-version
  current: 1.0.0
error_envelope:
  shape: status-code + description; no problem+json
  note: See errors/x402-swag-storefront-api-problem-types.yml
rate_limit_signaling:
  headers: []
  note: No documented rate-limit response headers.
reversibility:
  state: none
  grade: null
  note: Contract exposes write surfaces (create-checkout, pay-order, create-custom-design, approve-custom-design)
    but declares NO reversal operation (no cancel/refund/void/reverse/restore) and no reversal window.
    Payments settle in USDC on Base (on-chain, non-reversible). An agent cannot programmatically undo
    an order or payment via this API.
dry_run_mode:
  state: na
  note: No dry-run/preview mode for writes (create-custom-design produces a design PREVIEW, but that is
    a product feature, not a transaction rehearsal).
